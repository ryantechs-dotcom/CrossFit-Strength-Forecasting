stages:
  ingest:
    cmd: python src/ingest.py --zip-name athletes.zip --csv-name athletes.csv
    deps:
      - src/ingest.py
    outs:
      - data/raw/crossfit.csv

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/crossfit.csv
    params:
      - preprocess.outlier_zscore
    outs:
      - data/processed/crossfit.csv

  eda:
    cmd: python src/eda.py
    deps:
      - src/eda.py
      - data/raw/crossfit.csv
      - data/processed/crossfit.csv
    outs:
      - outputs/eda

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/processed/crossfit.csv
    outs:
      - data/processed/crossfit_features.csv
      - data/feature_store/crossfit_features.parquet

  feature_store_setup:
    cmd: python src/feature_store_setup.py
    deps:
      - src/feature_store_setup.py
      - feature_definitions.py
      - feature_store.yaml
      - data/feature_store/crossfit_features.parquet
    outs:
      - data/feature_store/registry.db
      - data/feature_store/online_store.db

  experiments:
    cmd: python src/run_experiments.py
    deps:
      - src/run_experiments.py
      - src/split_data.py
      - src/train.py
      - src/evaluate.py
      - random_seed.py
      - feature_definitions.py
      - params.yaml
      - data/processed/crossfit_features.csv
      - data/feature_store/registry.db
      - data/feature_store/online_store.db
    outs:
      - models/model_v1.pkl
      - models/model_v2.pkl
      - data/train/train.csv
      - data/test/test.csv
      - reports/split_documentation.txt
    metrics:
      - reports/evaluation_v1.txt:
          cache: false
      - reports/evaluation_v2.txt:
          cache: false

  compare:
    cmd: python src/compare_versions.py
    deps:
      - src/compare_versions.py
      - reports/evaluation_v1.txt
      - reports/evaluation_v2.txt
    outs:
      - reports/model_comparison.txt:
          cache: false

  automl_pycaret:
    cmd: python src/automl_pycaret.py
    deps:
      - src/automl_pycaret.py
      - data/processed/crossfit_features.csv
    params:
      - automl_pycaret.session_id
      - automl_pycaret.top_n_report
      - automl_pycaret.top_n_rerun
      - automl_pycaret.n_select
      - automl_pycaret.fold
    outs:
      - outputs/automl/pycaret_feature_importance_all.png
      - outputs/automl/pycaret_residuals_all.png
      - outputs/automl/pycaret_feature_importance_top.png
      - outputs/automl/pycaret_residuals_top.png
      - reports/automl_pycaret_summary.txt:
          cache: false
    metrics:
      - reports/automl_pycaret_leaderboard_all.csv:
          cache: false
      - reports/automl_pycaret_leaderboard_top_features.csv:
          cache: false

  automl_h2o:
    cmd: python src/automl_h2o.py
    deps:
      - src/automl_h2o.py
      - data/processed/crossfit_features.csv
    params:
      - automl_h2o.max_runtime_secs
      - automl_h2o.seed
      - automl_h2o.nfolds
      - automl_h2o.top_n_report
      - automl_h2o.top_n_rerun
    outs:
      - outputs/automl/h2o_varimp_all.png
      - outputs/automl/h2o_varimp_top.png
      - reports/automl_h2o_summary.txt:
          cache: false
    metrics:
      - reports/automl_h2o_leaderboard_all.csv:
          cache: false
      - reports/automl_h2o_leaderboard_top_features.csv:
          cache: false

  automl_compare:
    cmd: python src/automl_compare.py
    deps:
      - src/automl_compare.py
      - reports/automl_pycaret_leaderboard_all.csv
      - reports/automl_pycaret_leaderboard_top_features.csv
      - reports/automl_h2o_leaderboard_all.csv
      - reports/automl_h2o_leaderboard_top_features.csv
    params:
      - automl_compare.assignment1_baseline
    outs:
      - reports/automl_comparison.txt:
          cache: false