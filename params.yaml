preprocess:
  drop_na_threshold: 0.3
  outlier_zscore: 3.0
features:
  version: v1
split:
  test_size: 0.2
train:
  model_type: xgboost
  random_seed: 42
  hyperparameters:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
experiments:
- name: v1_baseline_small
  feature_version: v1
  hyperparameters:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.05
- name: v1_baseline_large
  feature_version: v1
  hyperparameters:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
- name: v2_engineered_small
  feature_version: v2
  hyperparameters:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.05
- name: v2_engineered_large
  feature_version: v2
  hyperparameters:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
automl_pycaret:
  session_id: 42
  top_n_features: 3
  n_select: 3
  fold: 5
automl_h2o:
  max_runtime_secs: 300
  seed: 42
  nfolds: 5
  top_n_features: 5
automl_compare:
  assignment1_baseline:
    model_name: FILL_IN
    validation_metric_name: FILL_IN
    validation_score: null
    training_time_seconds: null
    notes: 'Populate once Assignment #1 baseline numbers are provided.'
